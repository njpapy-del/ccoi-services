services:
  - type: web
    name: ccoi-services
    env: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ccoi-services.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: contact@ccoi-services.com
    autoDeploy: true
    healthCheckPath: /
